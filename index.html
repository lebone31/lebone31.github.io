<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Charlie 🎉</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap');

body {
  margin: 0;
  height: 100vh;
  background: #000;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Playfair Display', serif;
  overflow: hidden;
}

.page {
  display: none;
  text-align: center;
  padding: 20px;
}

.page.active {
  display: block;
}

.title {
  font-size: 24px;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  background: #fff;
  color: #000;
  cursor: pointer;
}

.envelope {
  font-size: 90px;
  cursor: pointer;
  animation: float 1.5s infinite;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

/* Heart styles */
.hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 999;
}

.heart {
  position: absolute;
  opacity: 0;
  animation: floatRainbow 7s linear forwards;
}

@keyframes floatRainbow {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(-120vh) scale(1.8);
  }
}
</style>
</head>
<body>

<!-- CAKE PAGE -->
<div class="page active" id="cakePage">
  <div class="title">HAPPY BIRTHDAY CHARLIE 🤍</div>
  <div class="cake">
    <img src="https://i.imgur.com/8YqGkWa.png?raw=true" alt="Cake" style="width:200px; filter: grayscale(100%);">
  </div>
  <div class="candles">
    <span class="candle on">🕯️</span>
    <span class="candle on">🕯️</span>
    <span class="candle on">🕯️</span>
  </div>
  <button onclick="startMic()">Blow Gently</button>
</div>

<!-- ENVELOPE PAGE -->
<div class="page" id="envelopePage">
  <div class="envelope" onclick="openLetter()">✉️</div>
</div>

<!-- LETTER PAGE -->
<div class="page" id="letterPage">
  <div class="letter-content">
    <h2>My Dear 🤍</h2>
    <p>I know we haven’t known each other for a very long time...</p>
    <p>Happy Birthday, my love 🤍</p>
  </div>
</div>

<div class="hearts" id="hearts"></div>

<!-- 🎉 confetti library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

<audio id="music">
  <source src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_1bdf1d9f1b.mp3">
</audio>

<script>
// page elements
const heartsDiv = document.getElementById("hearts");
const cakePage = document.getElementById("cakePage");
const envelopePage = document.getElementById("envelopePage");
const letterPage = document.getElementById("letterPage");
const candles = document.querySelectorAll(".candle");
const music = document.getElementById("music");

// listen for “blow”
function startMic() {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      const ctx = new AudioContext();
      const mic = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      mic.connect(analyser);
      analyser.fftSize = 256;
      const data = new Uint8Array(analyser.frequencyBinCount);

      function listen() {
        analyser.getByteFrequencyData(data);
        let volume = data.reduce((a, b) => a + b) / data.length;
        if (volume > 40) {
          candles.forEach(c => c.classList.remove("on"));
          softHearts();
          setTimeout(() => {
            cakePage.classList.remove("active");
            envelopePage.classList.add("active");
          }, 1000);
        } else {
          requestAnimationFrame(listen);
        }
      }
      listen();
    })
    .catch(() => alert("Microphone access is needed!"));
}

// rainbow hearts
function softHearts() {
  const colors = ["#ff0000","#ff7f00","#ffff00","#00ff00","#0000ff","#4b0082","#8f00ff","#ff69b4","#00ffff"];
  for (let i = 0; i < 40; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = "❤️";
    h.style.color = colors[Math.floor(Math.random() * colors.length)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (30 + Math.random() * 45) + "px";
    h.style.animationDuration = (5 + Math.random() * 3) + "s";
    h.style.animationDelay = (Math.random() * 1.5) + "s";
    heartsDiv.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }
}

// open letter + confetti
function openLetter() {
  envelopePage.classList.remove("active");
  letterPage.classList.add("active");

  // 🎊 confetti burst
  confetti({
    particleCount: 150,
    spread: 180,
    origin: { y: 0.6 }
  });

  music.volume = 0.4;
  music.play();
}
</script>

</body>
</html>
